<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossier de production — Cognac Embouteillage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE8; --surface:#F7F8F5; --surface2:#EEF1EC; --ink:#26302B; --muted:#56605A; --line:#D3D9D3;
  --accent:#36507A; --accent-ink:#FFFFFF; --amber:#E0892F; --amber-d:#B8581A; --cork:#2B2320; --scarf:#C8262C; --scarf-d:#96161C;
  --mint:#DCE8D6; --mint-ink:#35602B; --butter:#ECE3C3; --butter-ink:#65520E; --rose:#F0D8D2; --rose-ink:#8F352D;
  --lilac:#DDE3EC; --lilac-ink:#36507A; --sky:#D5E7E6; --sky-ink:#22605D; --peach:#EFDFCB; --peach-ink:#81461A;
  --focus:#36507A; --shadow:0 1px 2px rgba(38,48,43,.07);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C211F; --surface:#242A27; --surface2:#2B322E; --ink:#E3E8E3; --muted:#A3ADA6; --line:#39413C;
  --accent:#B9C8E6; --accent-ink:#1C211F; --amber:#E0892F; --amber-d:#A9521A; --cork:#0F0C0B; --scarf:#D4363A; --scarf-d:#A0222A;
  --mint:#2A3A26; --mint-ink:#B9D9AC; --butter:#3A3421; --butter-ink:#E5D38E; --rose:#432A27; --rose-ink:#F0B3AA;
  --lilac:#2C3648; --lilac-ink:#B9C8E6; --sky:#213A39; --sky-ink:#A5D6D2; --peach:#3E2E1F; --peach-ink:#EDC49B;
  --focus:#B9C8E6; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#1C211F; --surface:#242A27; --surface2:#2B322E; --ink:#E3E8E3; --muted:#A3ADA6; --line:#39413C;
  --accent:#B9C8E6; --accent-ink:#1C211F; --amber:#E0892F; --amber-d:#A9521A; --cork:#0F0C0B; --scarf:#D4363A; --scarf-d:#A0222A;
  --mint:#2A3A26; --mint-ink:#B9D9AC; --butter:#3A3421; --butter-ink:#E5D38E; --rose:#432A27; --rose-ink:#F0B3AA;
  --lilac:#2C3648; --lilac-ink:#B9C8E6; --sky:#213A39; --sky-ink:#A5D6D2; --peach:#3E2E1F; --peach-ink:#EDC49B;
  --focus:#B9C8E6; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.2}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:58px}
.bar h1{font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{font-size:14px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--lilac);color:var(--lilac-ink);white-space:nowrap;border:0;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.pill.warn{background:var(--rose);color:var(--rose-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field .lab{font-size:15px;font-weight:700;color:var(--ink)}
.field .hint{font-size:14px;color:var(--muted);margin-top:-2px}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface2);outline:none;min-height:50px}
.input:focus{border-color:var(--focus)}
.input[readonly]{opacity:.75}
textarea.input{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:520px){.row2,.row3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r-md);border:0;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);min-height:52px;text-decoration:none}
.btn.soft{background:var(--lilac);color:var(--lilac-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--rose);color:var(--rose-ink)}
.btn.ok{background:var(--mint);color:var(--mint-ink)}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.section-title{font-size:16px;font-weight:700;color:var(--muted);margin:28px 4px 10px}
.empty{color:var(--muted);padding:14px 4px}
.muted{color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.ppl{display:flex;flex-wrap:wrap;gap:8px;min-height:10px}
.pp{display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--mint);color:var(--mint-ink);font-weight:700;border:0;font-size:16px}
.pp svg{width:18px;height:18px}
.pp.sug{background:var(--surface2);color:var(--ink);border:1.5px dashed var(--line);padding:8px 14px}
.pp-add{display:flex;gap:8px}
.pp-add .input{flex:1}
.sug-t{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.ofh{display:flex;gap:16px;align-items:flex-end;margin-top:16px;padding:18px;border-radius:var(--r-lg);background:var(--lilac);color:var(--lilac-ink)}
.ofh .m{flex:1;min-width:0}
.ofh .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ofh .num{font-size:clamp(24px,5vw,32px);font-weight:800;word-break:break-all}
.ofh .des{font-size:19px;font-weight:700;color:var(--ink);margin-top:2px}
.ofh .meta{font-weight:600;font-size:15px;margin-top:2px}
.ofh .bottle{width:52px}
.more{margin-top:10px}
.more summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink)}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:'▾'}
.more[open] summary::after{content:'▴'}
.more .kv{color:var(--ink);background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.rfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:22px 0 2px}
.rfilter>span{font-weight:700;color:var(--muted);font-size:15px}
.rfilter .tab.on.cond{background:var(--lilac-ink);color:var(--surface)}
.rfilter .tab.on.cv{background:var(--mint-ink);color:var(--surface)}
.phase{margin-top:22px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.ph-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.ph-h h3{font-size:22px;font-weight:800}
.ph-h p{margin:2px 0 0;color:var(--muted);font-size:15px;font-weight:600}
.ph-n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.ph-done{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-md);background:var(--mint);color:var(--mint-ink);font-weight:700}
.ph-done svg{width:22px;height:22px;flex:none}
.ph-done span{flex:1;min-width:200px}
.ph-done .btn{background:var(--surface);border-color:transparent}
.ph-lock{padding:12px 14px;border-radius:var(--r-md);background:var(--surface2);color:var(--muted);font-weight:600;line-height:1.45}
.ph-lock>span{font-weight:800}
.grp{font-size:15px;font-weight:800;color:var(--muted);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.phase .grp:first-of-type{margin-top:4px}
.fts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ft{--rc:var(--lilac-ink);--rbg:var(--lilac);display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:var(--r-md);background:var(--surface2);border:1.5px solid transparent;border-left:6px solid var(--rc);min-height:92px}
.ft.cv{--rc:var(--mint-ink);--rbg:var(--mint)}
.ft .ic{width:46px;height:46px;border-radius:14px;background:var(--rbg);color:var(--rc);display:grid;place-items:center;flex:none;font-size:20px}
.ft .ic svg{width:26px;height:26px}
.ft .ic b{font-size:20px}
.ft .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ft .tt{font-size:18px;line-height:1.2}
.ft .wh{font-size:14px;color:var(--muted);font-weight:600}
.ft .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ft .chips .st{white-space:normal}
.fcasse{flex-direction:column;align-items:stretch;gap:10px;padding:0;overflow:hidden}
.fc-open{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 14px 0;background:none;border:0}
.fc-add{margin:0 14px 14px;min-height:46px}
.ft .arr{font-size:28px;color:var(--muted);font-weight:300}
.ft.bad{border-color:var(--rose-ink);border-left-color:var(--rose-ink);background:color-mix(in srgb,var(--rose) 45%,var(--surface2))}
.ft.lockd{opacity:.55}
.rp{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--rbg);color:var(--rc);text-transform:uppercase;letter-spacing:.03em}
.quick{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.alarm{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:19;background:#C8262C;color:#fff;box-shadow:0 4px 14px rgba(150,22,28,.35)}
.alarm-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.alarm .a{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.alarm .a svg{width:28px;height:28px;flex:none;animation:pulse 1.2s ease-in-out infinite}
.alarm .a .m{flex:1;min-width:180px}
.alarm .a b{display:block;font-size:19px;line-height:1.2}
.alarm .a small{display:block;font-weight:700;opacity:.92;font-size:15px}
.alarm .a button{background:#fff;color:#96161C;border:0;border-radius:12px;font-weight:800;padding:10px 16px;min-height:46px;font-size:16px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.alarm .a svg{animation:none}}
.qph{min-height:72px;font-size:21px}
.rl-cur{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rl{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--lilac-ink)}
.rl img,.rl .noimg{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2);display:grid;place-items:center;font-size:22px}
.rl b{display:block;font-size:17px}
.rl small{display:block;color:var(--muted);font-weight:600}
.entry.withph{display:grid;grid-template-columns:64px 1fr;column-gap:12px;align-items:start}
.entry.withph .eth{grid-row:1/span 3;width:64px;height:64px;border-radius:10px;object-fit:cover}
.entry.withph>*:not(.eth){grid-column:2}
.ph-img{display:block;max-width:100%;max-height:260px;border-radius:var(--r-md);border:1px solid var(--line);margin-bottom:8px;object-fit:contain;background:var(--surface2)}
.steps{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:15px}
.step .b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;flex:none}
.step .b svg{width:16px;height:16px}
.step.cur{color:var(--ink)} .step.cur .b{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.step.ok{color:var(--mint-ink)} .step.ok .b{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.steps .sep{flex:1;min-width:14px;height:2px;background:var(--line)}
.tile.lockd{opacity:.6;border-style:dashed}
.tile.lockd .ic{font-size:22px}
.tile .chips .st{white-space:normal}
.cl-sec h3{display:flex;align-items:center;gap:10px}
.cl-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:16px;flex:none}
.cl-n svg{width:18px;height:18px}
.cl-sec.done .cl-n{background:var(--mint);color:var(--mint-ink)}
.cl-sec.locked h3{color:var(--muted)} .cl-sec.locked .cl-n{background:var(--surface2);color:var(--muted)}
.cl-lock{color:var(--muted);font-weight:600}
.cl-it{padding:12px 0;border-bottom:1px solid var(--line)}
.cl-it:first-child{padding-top:0}
.cl-it .cl-l{font-weight:700;margin-bottom:8px}
.cl-it .choices .ch{max-width:200px}
.rj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 14px}
.rj-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rj-top .input{max-width:200px}
.rj-row{display:grid;grid-template-columns:1fr 150px 150px 64px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rj-row:last-child{border-bottom:0}
.rj-row.hd{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.rj-l{font-weight:700}
.rj-t{font-weight:800;font-size:19px;text-align:center}
.rj-t.z{color:var(--muted);font-weight:600}
.rj-g{font-size:14px;font-weight:800;color:var(--muted);padding:12px 0 2px;border-bottom:1px solid var(--line)}
.ctr{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.ctr button{border:0;background:none;height:46px;font-weight:800;font-size:22px}
.ctr button[data-d]{width:46px;flex:none;color:var(--accent)}
.ctr button[data-d]:active{background:var(--lilac)}
.ctr .n{flex:1;font-size:19px;min-width:0}
.ctr.on{border-color:var(--accent)}
.ctr.on .n{color:var(--accent)}
.ctr .cap{display:none}
.rj-l small.cl{display:block;font-size:13px;color:var(--muted);font-weight:600}
.pt-r{display:grid;grid-template-columns:1fr auto auto 90px;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pt-r:last-child{border-bottom:0}
.pt-r span:nth-child(2),.pt-r span:nth-child(3){color:var(--muted);font-size:15px}
.pt-r>b{text-align:right}
@media (max-width:520px){.pt-r{grid-template-columns:1fr 1fr}.pt-r>span:first-child{grid-column:1/-1;font-weight:700}}
.rj-l .tm{display:none;font-weight:800;color:var(--muted)}
@media (max-width:620px){
  .rj-row{grid-template-columns:1fr 1fr;row-gap:8px}
  .rj-row.hd{display:none}
  .rj-l{grid-column:1/-1;display:flex;justify-content:space-between}
  .rj-t{display:none}
  .rj-l .tm{display:inline}
  .ctr{position:relative}
  .ctr .cap{display:block;position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
}
.choices.many{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ch{flex:1 1 0;min-width:88px;min-height:52px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-size:16px;transition:transform .08s}
.ch:active{transform:scale(.96)}
.ch.on.good{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.ch.on.bad{background:var(--rose);color:var(--rose-ink);border-color:transparent}
.ch.on.neutral{background:var(--lilac);color:var(--lilac-ink);border-color:transparent}
.ch:disabled{cursor:default}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--rose);color:var(--rose-ink);font-weight:700;font-size:16px;line-height:1.35}
.alert.info{background:var(--butter);color:var(--butter-ink);font-weight:600}
.alert.good{background:var(--mint);color:var(--mint-ink)}
.alert svg{flex:none;width:22px;height:22px;margin-top:1px}
.alert+.alert{margin-top:8px}
.field .alert{margin-top:4px}
.banner{margin:14px 0 0}

/* Home: current production */
.hero{padding:24px 4px 12px}
.hero h2{font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.05}
.hero p{color:var(--muted);margin:8px 0 0}
.prod{display:flex;gap:18px;align-items:stretch;padding:20px;border-radius:var(--r-lg);background:var(--lilac);color:var(--lilac-ink);border:0}
.prod .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prod .of{font-size:clamp(26px,6vw,38px);font-weight:800;line-height:1.05;letter-spacing:.01em;word-break:break-all}
.prod .des{font-size:19px;font-weight:700;color:var(--ink)}
.prod .meta{font-size:15px;font-weight:600;opacity:.9}
.prod .btn{margin-top:12px;align-self:flex-start}
.bottle{width:64px;flex:none;align-self:flex-end}
.bottle .liquid{transition:y .7s cubic-bezier(.2,.8,.2,1),height .7s cubic-bezier(.2,.8,.2,1)}
.bottle svg{display:block;width:100%;height:auto}
.bottle .glass{fill:color-mix(in srgb,var(--surface) 65%,transparent)}
.bottle .glass-line{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-opacity:.55}
.bottle .liquid{transition:y .7s cubic-bezier(.2,.8,.2,1),height .7s cubic-bezier(.2,.8,.2,1)}
.bottle .pct{font-size:14px;font-weight:800;text-align:center;margin-top:4px}
@media (prefers-reduced-motion:reduce){.bottle .liquid{transition:none}}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.li .m{flex:1;min-width:0}
.li b{display:block}
.li small{color:var(--muted);display:block}
.st{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st.prevu{background:var(--lilac);color:var(--lilac-ink)}
.st.encours{background:var(--butter);color:var(--butter-ink)}
.st.cloture{background:var(--mint);color:var(--mint-ink)}
.st.bad{background:var(--rose);color:var(--rose-ink)}
.st.good{background:var(--mint);color:var(--mint-ink)}

/* Dossier */
.ofhead{margin-top:16px;padding:16px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.ofhead .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ofhead .num{font-size:24px;font-weight:800}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 16px;margin-top:10px}
.kv div{font-size:15px}
.kv span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kv b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.role{margin-top:26px;--rc:var(--lilac-ink);--rbg:var(--lilac)}
.role.cv{--rc:var(--mint-ink);--rbg:var(--mint)}
.role-h .dot{width:14px;height:14px;border-radius:50%;background:var(--rc);flex:none;align-self:center}
.tile .ic{width:46px;height:46px;border-radius:14px;background:var(--rbg);color:var(--rc);display:grid;place-items:center;margin-bottom:4px}
.tile .ic svg{width:26px;height:26px}
.todo{margin-top:18px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.todo h3{font-size:20px;font-weight:800;margin:0 0 12px}
.todo .it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:var(--r-md);border:0;background:var(--surface2);border-left:6px solid var(--rc);margin-top:8px;--rc:var(--lilac-ink)}
.todo .it.cv{--rc:var(--mint-ink)}
.todo .it.late{background:var(--rose)}
.todo .it b{display:block;font-size:18px}
.todo .it small{display:block;color:var(--muted);font-weight:600}
.todo .it .m{flex:1;min-width:0}
.todo .it .go{font-weight:800;color:var(--rc);white-space:nowrap}
.todo .it.late .go,.todo .it.late small{color:var(--rose-ink)}
.todo .done{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--mint-ink)}
.todo .done svg{width:24px;height:24px}
.sec-tools{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:-4px 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.prog{font-weight:700;color:var(--muted);font-size:15px}
.clock{font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:.02em;color:var(--muted);line-height:1}
.lp{display:flex;gap:8px;flex-wrap:wrap}
.lpb{position:relative;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.lpb i{width:9px;height:9px;border-radius:50%;background:var(--line);order:-1}
.lpb.run i{background:var(--mint-ink)} .lpb.next i{background:var(--accent)}
.lpb.on{background:var(--ink);color:var(--bg);border-color:transparent}
.lp-lock{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:var(--r-md);background:var(--mint);color:var(--mint-ink);font-weight:600}
.lp-lock .dot{width:10px;height:10px;border-radius:50%;background:var(--mint-ink);flex:none}
.lp-lock span:nth-child(2){flex:1}
.lp-lock .linkbtn{color:var(--mint-ink);padding:4px 8px}
.lp-wrap{display:flex;align-items:center;gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.lp-wrap>span{font-weight:700;color:var(--muted);font-size:15px;flex:none}
.lp-wrap .lp{flex-wrap:nowrap}
.lp-wrap .lpb{flex:none}
.lp.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lp.big .lpb{border-radius:var(--r-lg);padding:20px;flex-direction:column;align-items:flex-start;gap:4px;min-height:100px;box-shadow:0 1px 2px rgba(38,48,43,.05)}
.lp.big .lpb b{font-size:24px;font-weight:800}
.lp.big .lpb small{color:var(--muted);font-weight:600;font-size:14px}
.lp.big .lpb i{position:absolute;top:16px;right:16px;width:12px;height:12px}
.lp.big .lpb.on small{color:inherit;opacity:.8}
.lp.big .lpb.run{border-color:var(--mint-ink)} .lp.big .lpb.next{border-color:var(--accent)}
.hero.hl{display:flex;gap:16px;align-items:center}
.hl{display:flex;gap:16px;align-items:center}
.hlogo{height:86px;width:auto;background:#fff;border-radius:16px;padding:6px;border:1px solid var(--line)}
@media (max-width:520px){.hlogo{height:64px}}
.hero.row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}

.role-h{display:flex;align-items:baseline;gap:12px;padding:0 4px 0;border-bottom:2px solid var(--ink);padding-bottom:8px}
.role-h h3{font-size:24px;font-weight:800;flex:1}
.role-h span{color:var(--muted);font-weight:600;font-size:15px}
.role .tiles{margin-top:12px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-height:128px}
.tile .n{font-size:14px;font-weight:700;color:var(--muted)}
.tile h3{font-size:20px;font-weight:800}
.tile .who{font-size:14px;color:var(--muted)}
.tile .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tile.bad{border-color:var(--rose-ink)}
.tile.done{border-color:color-mix(in srgb,var(--mint-ink) 55%,var(--line))}

/* Fiche */
.fhead{padding:22px 4px 6px}
.fhead h2{font-size:28px;font-weight:800}
.fhead p{margin:4px 0 0;color:var(--muted);font-weight:600}
.sec{margin-top:18px}
.sec>h3{font-size:21px;font-weight:800;margin:0 4px 10px}
.sig{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-md);background:var(--surface2);margin-top:4px}
.sig .m{flex:1;min-width:180px;font-weight:600}
.entry{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line)}
.entry.bad{border-color:var(--rose-ink)}
.entry .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry .h b{font-size:18px}
.entry .h small{color:var(--muted)}
.entry .vals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:15px}
.entry .vals span{color:var(--muted)}
.entry .ncs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.due{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-weight:700;margin-bottom:10px}
.due.ok{background:var(--mint);color:var(--mint-ink)}
.due.late{background:var(--rose);color:var(--rose-ink)}
.due.wait{background:var(--butter);color:var(--butter-ink)}
.grp-t{font-size:16px;font-weight:800;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.grp-t:first-child{border-top:0;padding-top:0;margin-top:0}

/* Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,24,22,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{border-radius:22px}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h3{flex:1;font-size:20px;font-weight:800}
.sheet .sb{overflow:auto;padding:16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet .sf{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet .sf .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--cork);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.tab{padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.tab.on{background:var(--ink);color:var(--bg);border-color:transparent}
.ord{display:flex;flex-direction:column;gap:4px}
.ord button{width:38px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.ord svg{width:16px;height:16px}
.foot{margin-top:40px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:700;text-decoration:underline;padding:10px;font-size:15px}

/* ===== Finitions visuelles ===== */
.brand{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;padding:3px;border:1px solid var(--line)}
.brand img{width:100%;height:100%;object-fit:contain}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:18px}
.kpi{padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent)}
.kpi.bad{border-top-color:var(--rose-ink)}
.kpi span{display:block;font-weight:700;color:var(--muted);font-size:14px}
.kpi b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.kpi small{color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.hb{display:flex;flex-direction:column;gap:10px}
.hbr{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:10px;align-items:center}
.hl2{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hbt i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hbt i.bad{background:var(--rose-ink)} .hbt i.warn{background:var(--amber)}
.hbr b{text-align:right}
.vb{display:flex;gap:6px;align-items:flex-end;height:200px;overflow-x:auto;padding-top:6px}
.vbc{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.vbc b{font-size:12px}
.vbt{flex:1;width:70%;display:flex;align-items:flex-end;background:var(--surface2);border-radius:6px 6px 0 0}
.vbt i{display:block;width:100%;background:linear-gradient(180deg,var(--amber),var(--amber-d));border-radius:6px 6px 0 0}
.vbc small{color:var(--muted);font-weight:700;font-size:12px}
.ofl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
.ofr{display:grid;grid-template-columns:minmax(160px,2fr) 1fr 1fr 60px 50px 110px;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;min-width:620px}
.ofr:last-child{border-bottom:0}
.ofr.hd{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ofr small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.ofr .bad{color:var(--rose-ink);font-weight:800}
.dashes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.dash{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--line);box-shadow:0 1px 2px rgba(38,48,43,.05)}
.dash.run{border-top-color:var(--mint-ink)}
.dash.alert{border-color:var(--rose-ink);border-top-color:var(--rose-ink)}
.dash.empty{opacity:.6}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh b{font-size:19px}
.dof{font-size:20px;font-weight:800;color:var(--accent);word-break:break-all}
.ddes{color:var(--muted);font-weight:600;font-size:14px;margin-top:-4px}
.dbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.dbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber-d),var(--amber));border-radius:99px}
.dpct{font-size:13px;font-weight:700;color:var(--muted)}
.dc{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 10px;border-radius:9px;background:var(--surface2)}
.dc span{font-weight:600;color:var(--muted)}
.dc.ok b{color:var(--mint-ink)} .dc.wait{background:var(--butter)} .dc.wait b{color:var(--butter-ink)} .dc.late{background:var(--rose)} .dc.late b,.dc.late span{color:var(--rose-ink)}
.dstep{font-weight:700;color:var(--accent);padding:6px 0}
.dk{display:flex;gap:12px;font-size:14px;font-weight:700;color:var(--muted);margin-top:2px}
.dk .bad{color:var(--rose-ink)}
.entry.skip{background:var(--surface2);border-style:dashed;border-color:var(--butter-ink)}
.entry.skip b{color:var(--butter-ink)}
.pals{display:flex;flex-direction:column;gap:6px}
.pal{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center}
.pal.hd{font-size:13px;font-weight:800;color:var(--muted)}
.pal .input{min-height:46px}
.pal-tot{font-size:15px;color:var(--muted);margin:4px 0}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
.reg table{border-collapse:collapse;width:100%;min-width:1100px;font-size:14px}
.reg th{text-align:left;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:10px;border-bottom:2px solid var(--line);white-space:nowrap}
.reg td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.reg tr[data-nof]{cursor:pointer}
.reg tr[data-nof]:hover td{background:var(--surface2)}
.reg td.bad{color:var(--rose-ink);font-weight:800}
.reg small{color:var(--muted)}
.scanbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:var(--r-lg);background:var(--lilac);color:var(--lilac-ink)}
.scanbox .m{flex:1;min-width:220px} .scanbox b{display:block;font-size:19px} .scanbox small{display:block;font-weight:600;color:var(--ink);opacity:.8}
.scanbox .btn{min-height:56px;font-size:18px}
.scanbtns{display:flex;gap:10px;flex-wrap:wrap}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.shp{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px}
.shp img{width:100%;height:140px;object-fit:cover;border-radius:8px} .shp small{color:var(--muted);font-weight:600}
.pausebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border-radius:var(--r-lg);background:var(--butter);color:var(--butter-ink);font-size:26px}
.pausebar .m{flex:1;min-width:200px;font-size:16px} .pausebar b{display:block;font-size:19px} .pausebar small{font-weight:600}
.tbr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.tbr .m{flex:1;min-width:0} .tbr b{display:block} .tbr small{display:block;color:var(--muted);font-weight:600}
.li.rp.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cb{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600}
.cb input{width:22px;height:22px}
.hist{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface2);border:1px dashed var(--line);font-size:14px}
.hist .hi{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hist .hi:first-of-type{border-top:0;padding-top:0}
.hist small{color:var(--muted);font-weight:700;display:block}
.hist s{color:var(--muted)}
.netpill{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
.netpill.off{background:var(--rose);color:var(--rose-ink)}
.netpill.wait{background:var(--butter);color:var(--butter-ink)}
.testpill{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:5px 10px;border-radius:99px;background:var(--butter);color:var(--butter-ink);white-space:nowrap}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;margin:0 0 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lilac-ink);color:var(--muted);font-weight:600;font-size:15px;line-height:1.4}
.note svg{width:20px;height:20px;flex:none;color:var(--lilac-ink);margin-top:1px}
.note.banner{margin-top:14px}
.fhead{display:flex;gap:14px;align-items:center;padding:22px 2px 14px;--rc:var(--lilac-ink);--rbg:var(--lilac)}
.fhead.cv{--rc:var(--mint-ink);--rbg:var(--mint)}
.fh-ic{width:58px;height:58px;border-radius:18px;background:var(--rbg);color:var(--rc);display:grid;place-items:center;flex:none}
.fh-ic svg{width:32px;height:32px}
.fh-m{min-width:0}
.fhead h2{font-size:clamp(24px,5vw,30px);font-weight:800;margin-top:4px}
.fhead p{margin:2px 0 0;color:var(--muted);font-weight:600}
.fhead .rp{display:inline-block}
.sec>h3{display:flex;align-items:center;gap:10px;font-size:19px}
.sec>h3::before{content:'';width:5px;height:22px;border-radius:3px;background:var(--accent);flex:none}
.cl-sec>h3::before{display:none}
.card{box-shadow:0 1px 2px rgba(38,48,43,.05),0 4px 14px rgba(38,48,43,.04)}
.ch{background:var(--surface);transition:transform .08s,background .15s,border-color .15s}
.ch.on.good::before{content:'✓ '}
.ch.on.bad::before{content:'✕ '}
.ch.on.neutral::before{content:'● ';font-size:.8em}
.ch.on{box-shadow:inset 0 0 0 2px currentColor}
.field>label,.field .lab{font-size:16px}
.input{background:var(--surface);border-width:2px}
.input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 18%,transparent)}
.entry{box-shadow:0 1px 2px rgba(38,48,43,.05)}
.entry .h b{font-size:17px}
.phase{position:relative;box-shadow:0 1px 2px rgba(38,48,43,.05),0 4px 14px rgba(38,48,43,.04)}
.phase+.phase::before{content:'';position:absolute;left:33px;top:-24px;width:3px;height:24px;background:var(--line)}
.ph-n{background:var(--accent);color:var(--accent-ink)}
.todo{border:2px solid var(--accent);box-shadow:0 6px 20px rgba(54,80,122,.08)}
.todo h3{display:flex;align-items:center;gap:8px}
.todo h3::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.steps{box-shadow:0 1px 2px rgba(38,48,43,.05)}
.prod{box-shadow:0 6px 22px rgba(54,80,122,.10)}
.hero h2{letter-spacing:-.01em}
@media (max-width:520px){.fh-ic{width:48px;height:48px}.fh-ic svg{width:26px;height:26px}.phase{padding:14px}.phase+.phase::before{left:31px}}

/* ===== Ergonomie : icônes et repères ===== */
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
svg.i.big{width:28px;height:28px}
.btn svg.i{width:20px;height:20px}
.bar h1{display:flex;flex-direction:column;line-height:1.15}
.bsub{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resp-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;text-decoration:none;padding:8px 14px;background:var(--surface)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.act{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1.5px solid var(--line);min-height:76px}
.act b{display:block;font-size:17px} .act small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.act .ai{width:44px;height:44px;border-radius:13px;background:var(--lilac);color:var(--lilac-ink);display:grid;place-items:center;flex:none}
.act .ai svg{width:24px;height:24px}
.act.prim{background:var(--accent);border-color:transparent;color:var(--accent-ink)} .act.prim small{color:inherit;opacity:.85} .act.prim .ai{background:rgba(255,255,255,.18);color:inherit}
.act:active,.ft:active,.tile:active,.lpb:active{transform:scale(.985)}

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const frDate=s=>{ if(!s) return ''; const [y,m,d]=String(s).split('-'); return d? d+'/'+m+'/'+y : s; };
const dur=(a,b)=>{ if(!a||!b) return ''; const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number); let d=(h2*60+m2)-(h1*60+m1); if(d<0) d+=1440; return Math.floor(d/60)+' h '+pad(d%60); };
const frDT=ms=>{ if(!ms) return ''; const d=new Date(ms); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' à '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const num=v=>{ if(v==null||v==='') return null; const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,'')); return isNaN(n)?null:n; };
const norm=v=>String(v||'').toUpperCase().replace(/\s+/g,'');

  return OFS.filter(o=>o.id!==of.id&&o.ligne===of.ligne&&t(o)&&t(o)<=ref).sort((a,b)=>t(b)-t(a))[0]||null; }

const photoUrl=v=>!v||typeof v!=='object'?'':v.id?SB.url+'/storage/v1/object/public/'+SB.bucket+'/'+v.id:(v.data||'');
function shrink(file,max,q){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',q)}):rej(new Error('blob')),'image/jpeg',q); }; img.onerror=e=>{ URL.revokeObjectURL(u); rej(e); }; img.src=u; }); }

function fieldsHTML(fields,vals,of,fd,ro){

function bindFields(root,fields,getVal,setVal,of,fd){
  const byK=Object.fromEntries(fields.map(x=>[x.k,x]));
  const refresh=k=>{ const x=byK[k]; const box=root.querySelector(`[data-f="${k}"] .iss`); if(!box) return; const m=fieldIssue(x,getVal(k),of,fd); box.innerHTML=m?`<div class="alert">${ICON.warn}<span>${esc(m)}</span></div>`:''; };

    setVal(k,nv); refresh(k); });

  root.querySelectorAll('[data-pk2]').forEach(w=>{ const k=w.dataset.pk2; if(!byK[k]) return; const box=w.closest('[data-f]');
    const cur=()=>{ const v=getVal(k); return Array.isArray(v)&&v.length?clone(v):[{n:'',cols:''}]; };
    const redraw=list=>{ setVal(k,list); const nw=document.createElement('div'); nw.innerHTML=palsInner(k,list,false,of); const el=nw.firstElementChild; w.replaceWith(el); bindFields(box,[byK[k]],getVal,setVal,of,fd); };
    w.querySelectorAll('[data-pi]').forEach(row=>{ const i=+row.dataset.pi; row.querySelectorAll('[data-pf]').forEach(inp=>inp.addEventListener('input',()=>{ const list=cur(); list[i]=list[i]||{}; list[i][inp.dataset.pf]=inp.value;

    const ad=w.querySelector('[data-padd2]'); if(ad) ad.onclick=()=>{ const list=cur(); const last=list[list.length-1]||{}; const nn=num(last.n); list.push({n:nn!=null?String(nn+1):'',cartons:'',cols:''}); redraw(list); setTimeout(()=>{ const r=box.querySelectorAll('[data-pi]'); const i=r[r.length-1]&&r[r.length-1].querySelector('[data-pf="cols"]'); if(i) i.focus(); },30); };
  });
  root.querySelectorAll('[data-f]').forEach(box=>{ const k=box.dataset.f; const x=byK[k]; if(!x||x.t!=='people') return;
    const draw=()=>{ const lab=box.querySelector('.lab').outerHTML+(box.querySelector('.hint')?box.querySelector('.hint').outerHTML:''); box.innerHTML=lab+peopleInner(k,getVal(k),false)+'<div class="iss"></div>'; wire(); };
    const setP=list=>{ setVal(k,list.join(', ')); draw(); };
    const wire=()=>{
      box.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{ const l=splitP(getVal(k)); l.splice(+b.dataset.prm,1); setP(l); });

      const doAdd=()=>{ const v=inp.value.trim().replace(/,/g,' '); if(!v) return; const n=v.charAt(0).toUpperCase()+v.slice(1); const l=splitP(getVal(k)); if(!l.some(c=>c.toLowerCase()===n.toLowerCase())) l.push(n); rememberP(l); setP(l); setTimeout(()=>{ const i2=box.querySelector('[data-pin]'); if(i2) i2.focus(); },30); };
      if(add) add.onclick=doAdd; if(inp) inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } };
    }; wire(); });
  root.querySelectorAll('input[data-k],textarea[data-k]').forEach(i=>{ const k=i.dataset.k; if(!byK[k]) return;
    i.addEventListener('input',()=>{ setVal(k,i.value,true); refresh(k); });
    i.addEventListener('change',()=>{ setVal(k,i.value,false); refresh(k); }); });

function dueInfo(list,fd){

  if(mins>=CTL_EVERY) return {s:'wait',t:`Contrôle à faire maintenant (dernier il y a ${hm(mins)})`};

function ficheStatus(fid,of){
  const F=FICHE[fid], fd=FDOCS[fid]; const chips=[]; let bad=false, done=false;

    const n=F.sections.flatMap(s=>s.fields).filter(x=>fieldIssue(x,v[x.k],of,fd)).length; if(n){ bad=true; chips.push(`<span class="st bad">${n} alerte${n>1?'s':''}</span>`); } }

  if(F.checklist){ const es=entriesOf(fd,'checklist'); if(es.length){ done=true; const l=es[es.length-1]; chips.length=0; chips.push(`<span class="st good">Validée · équipe ${esc(l.equipe||'?')}</span>`); } else chips.push(`<span class="st prevu">À faire</span>`); }
  if(F.journal){ const t=cTotal(of,fd); if(t){ done=true; chips.push(`<span class="st encours">À pointer : ${t}</span>`); } }
  if(F.sections&&fid!=='demarrage'){ const v=(fd&&fd.values)||{}; if(F.sections.flatMap(s=>s.fields).some(x=>v[x.k])) done=true; }
  (F.checklist?[]:(F.lists||[])).forEach(l=>{ const es=entriesOf(fd,l); if(es.length){ done=true; chips.push(`<span class="st prevu">${LISTS[l].short.charAt(0).toUpperCase()+LISTS[l].short.slice(1)} : ${es.length}</span>`); }

  return {chips,bad,done};
}

function todoHTML(of){

  else if(!valid) items.push({r:'Conducteur de ligne',t:'Valider le démarrage',s:'Étape 3 · avant de lancer la production',fi:'demarrage'});
  else if(of.pause){ items.push({r:'Conducteur de ligne',t:'Ligne en pause',s:`${of.pause.why||''} depuis ${frDT(of.pause.at)}`,fi:'',pause:1}); }

    });

    const eq=entriesOf(fd.equipes,'equipes'); if(!eq.some(e=>e.date===today())) items.push({r:'Charlotte verte',t:"Enregistrer l'équipe du jour",s:'Composition des équipes',fi:'equipes',add:'equipes'});

    :`<div class="done">${ICON.check}<span>Tout est à jour pour l'instant.</span></div>`}</div>`.replace('<div class="todo">',`<div class="todo" data-items='${esc(JSON.stringify(items.map(i=>({fi:i.fi,add:i.add||'',late:i.late||0,pause:i.pause||0}))))}'>`);

async function scanTickets(files){
  if(!SAMPLE){ toast("La lecture automatique n'est disponible que dans l'application en ligne."); return null; }
  const photo=await storePhoto(files[0]); const imgs=[]; for(const f of files) imgs.push((await shrink(f,2000,0.85)).blob);
  const r=await SAMPLE.json(`Voici la ou les photos des tickets imprimés lors d'un contrôle sur une ligne d'embouteillage : un ticket de l'alcoomètre (TAV) et/ou un ticket de la balance (pesée, "FIN DE LOT").
Réponds UNIQUEMENT avec un objet JSON, sans texte autour :
{"tav": la valeur "Alcool (% v/v)" du ticket TAV, sans unité (ex. "39.99"), sinon null,
 "tavDate": la "Date" du ticket TAV au format JJ/MM/AAAA, sinon null,
 "tavHeure": l'"Heure" du ticket TAV au format HH:MM, sinon null,
 "moyenne": la valeur "MOYENNE" du ticket de pesée, sans unité (ex. "353.7"), sinon null,
 "lotAccepte": true si le ticket de pesée indique "LOT ACCEPTE", false s'il indique un refus, sinon null}
Mets null pour toute valeur absente ou illisible.`,{images:imgs,modelTier:'default'});
  if(!r||typeof r!=='object') return null;
  const v=x=>x==null?'':String(x).trim().replace('.',',');
  const toISO=dt=>{ const m=String(dt||'').match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if(!m) return ''; const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; };
  const th=String(r.tavHeure||'').match(/(\d{1,2})[:h](\d{2})/); const td=toISO(r.tavDate); const hh=th?pad(+th[1])+':'+th[2]:'';
  const tavInfo=r.tav!=null&&(td||hh)?`TAV mesuré${td?' le '+frDate(td):''}${hh?' à '+hh:''}`:'';
  return {tav:v(r.tav),tavInfo,date:td,heure:hh,peseeMoy:v(r.moyenne),peseeOk:r.lotAccepte===true?'C':r.lotAccepte===false?'NC':'',ticket:photo};
}

async function updFiche(ofId,fid,patch){

  ofs.filter(of=>!of.pause).forEach(of=>CTLS.forEach(([fid,l,t,r])=>{
    let last=of.lastCtl&&of.lastCtl[l];
    if(curOfId===of.id&&FLOADED){ const es=entriesOf(FDOCS[fid],l); if(es.length) last=Math.max(last||0,...es.map(e=>e._at||0)); }
    const base=Math.max(last||of.startedAt||0,of.resumeAt||0); if(!base) return;

  }));
  return out;
}

  const el=$('#alarm'); if(!el) return;
  const showOn=['home','dossier','fiche'].includes(view.name);
  const late=showOn?lateControls():[];
  if(!late.length){ el.className=''; el.innerHTML=''; return; }
  el.className='alarm';
  el.innerHTML=`<div class="alarm-in">${late.map((a,i)=>`<div class="a">${ICON.warn}<div class="m"><b>${esc(a.t)} en retard !</b><small>${esc(a.r)} · OF ${esc(a.of.numero)} · ${a.first?'aucun contrôle depuis le démarrage':'dernier contrôle'} il y a ${hm(a.mins)}</small></div><button data-al="${i}">Faire le contrôle ?</button></div>`).join('')}</div>`;
  el.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{ const a=late[+b.dataset.al]; askControl(a.of,a.fid,a.l,a.t); });
  let fresh=false; late.forEach(a=>{ if(!alarmSeen[a.key]){ alarmSeen[a.key]=1; fresh=true; } }); if(fresh) beep();
}
setInterval(renderAlarm,20000);

/* ============ SUPABASE : base de données partagée ============ */
const SB={ url:'https://bxluecwyxesomavbwzen.supabase.co', key:'sb_publishable_BUTb8XOgQ5iaL4-O0jHZpA_9zrimkwW',
  table:'production', bucket:'production-photos',
  lib:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js' };
let SBC=null, SBUSER=null, SBERR='', SBMAIL='';
async function sbConnect(){
  try{ if(!(window.supabase&&window.supabase.createClient)) await loadScript(SB.lib);
    SBC=window.supabase.createClient(SB.url,SB.key,{auth:{persistSession:true,autoRefreshToken:true}}); }
  catch(e){ SBC=null; SBERR="Le module de connexion n’a pas pu se charger : vérifiez la connexion internet, puis rechargez la page."; return; }
  try{ const {data}=await SBC.auth.getSession(); SBUSER=data&&data.session?data.session.user:null; }catch(e){ SBUSER=null; }
}
async function sbLogout(){ confirmSheet('Se déconnecter ?',`Les saisies pas encore envoyées restent sur la tablette. Il faudra se reconnecter avec l’e-mail et le mot de passe.`,'Se déconnecter',async()=>{
  ls.set('dp-sb-mail',''); try{ await SBC.auth.signOut(); }catch(e){} location.reload(); },'soft'); }
function sbErr(error,status){ const m=(error&&error.message)||''; const e=new Error(m||'supabase');
  if(status===403||(error&&(error.code==='42501'||error.code==='PGRST301'))) e.code='not_granted';
  else if(status===413) e.code='too_large';
  else if(status===400||status===404||status===409||status===422) e.code='invalid_argument';
  return e; } // autres cas (réseau, 401, 5xx) : la saisie reste en attente et sera renvoyée
const sbNo=()=>{ const e=new Error('offline'); e.code='unavailable'; throw e; };
const sbMark=c=>c==='fiches';
function sbFill(c,id,o){ if(c!=='fiches') return o; const [ofId,fiche]=String(id).split('--'); return Object.assign({id,ofId,fiche,values:{},sig:{},entries:{}},o); }
async function sbSelect(c,f){ if(!SBC) sbNo(); const out=[];
  for(let from=0;;from+=1000){ let q=SBC.from(SB.table).select('id,data').eq('collection',c); if(f) q=f(q);
    const {data,error,status}=await q.order('id').range(from,from+999); if(error) throw sbErr(error,status);
    (data||[]).forEach(r=>{ const d=r.data||{}; if(d.id==null) d.id=r.id; out.push({id:r.id,d}); }); if(!data||data.length<1000) break; }
  return out; }
const sbDocs=l=>({docs:l.map(x=>({id:x.id,exists:true,data:()=>clone(x.d)}))});
function sbWatch(c,f,match,fn,err){ let alive=true, busy=false, again=false, timer=null;
  const load=async()=>{ if(!alive) return; if(busy){ again=true; return; } busy=true;
    try{ const l=await sbSelect(c,f); if(alive) fn(sbDocs(l)); }catch(e){ if(err) err(e); }
    busy=false; if(again){ again=false; load(); } };
  const later=()=>{ clearTimeout(timer); timer=setTimeout(load,400); };
  let ch=null; try{ ch=SBC&&SBC.channel('dp-'+c+'-'+Math.random().toString(36).slice(2,8))
    .on('postgres_changes',{event:'*',schema:'public',table:SB.table,filter:'collection=eq.'+c},p=>{ if(!match||match(p)) later(); }).subscribe(); }catch(e){}
  const poll=setInterval(()=>{ if(!document.hidden&&navigator.onLine) load(); },60000);
  const vis=()=>{ if(!document.hidden) load(); }; document.addEventListener('visibilitychange',vis); window.addEventListener('online',vis);
  load();
  return ()=>{ alive=false; clearInterval(poll); clearTimeout(timer); document.removeEventListener('visibilitychange',vis); window.removeEventListener('online',vis); try{ ch&&SBC.removeChannel(ch); }catch(e){} }; }
const SBDB={
  collection(c){ return {
    doc(id){ id=String(id); return {
      async set(o){ if(!SBC) sbNo();
        if(sbMark(c)){ const {error,status}=await SBC.rpc('prod_merge',{p_collection:c,p_id:id,p_patch:sbFill(c,id,o)}); if(error) throw sbErr(error,status); return; }
        const {error,status}=await SBC.from(SB.table).upsert({collection:c,id,data:o}); if(error) throw sbErr(error,status); },
      async update(p){ if(!SBC) sbNo();
        const {error,status}=await SBC.rpc('prod_merge',{p_collection:c,p_id:id,p_patch:sbFill(c,id,p)}); if(error) throw sbErr(error,status); },
      async delete(){ if(!SBC) sbNo(); const {error,status}=await SBC.from(SB.table).delete().eq('collection',c).eq('id',id); if(error) throw sbErr(error,status); },
      async get(){ if(!SBC) sbNo(); const {data,error,status}=await SBC.from(SB.table).select('data').eq('collection',c).eq('id',id).maybeSingle();
        if(error) throw sbErr(error,status); return {exists:!!data,data:()=>data?clone(data.data):undefined}; },
      onSnapshot(fn,err){ return sbWatch(c,q=>q.eq('id',id),p=>((p.new&&p.new.id)||(p.old&&p.old.id))===id,
        r=>{ const x=r.docs[0]; fn({exists:!!x,data:()=>x?x.data():undefined}); },err); } }; },
    onSnapshot(fn,err){ return sbWatch(c,null,null,fn,err); },
    where(f,op,v){ return { onSnapshot(fn,err){ return sbWatch(c,q=>q.eq('of_id',String(v)),p=>!p.new||!p.new.of_id||p.new.of_id===String(v),fn,err); } }; } }; },
  doc(path){ const [c,id]=String(path).split('/'); return this.collection(c).doc(id); }
};
const SBASSETS={ async upload(blob,opt){ if(!SBC) sbNo();
  const d=new Date(); const path=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}/${uid()}${uid()}.jpg`;
  const {error,status}=await SBC.storage.from(SB.bucket).upload(path,blob,{contentType:(opt&&opt.type)||'image/jpeg',upsert:false});
  if(error) throw sbErr(error,status); return {id:path}; } };
function renderSbLogin(app){
  $('#bar').className='bar'; $('#bar').innerHTML=`<div class="bar-in"><h1>Connexion</h1></div>`;
  app.innerHTML=`<div class="hero hl" style="margin-bottom:16px"><img class="hlogo" src="${LOGO}" alt="Cognac Embouteillage"><div><h2>Dossier de production</h2><p>Connectez-vous avec l’identifiant fourni par le service qualité.</p></div></div>
    <div class="alert" id="sb-err" style="margin:0 0 14px;${SBERR?'':'display:none'}">${ICON.warn}<span>${esc(SBERR)}</span></div>
    <div class="card">
      <div class="field"><label for="sb-mail">Adresse e-mail</label><input class="input" type="email" id="sb-mail" autocomplete="username" inputmode="email" value="${esc(ls.get('dp-sb-mail',''))}"></div>
      <div class="field"><label for="sb-pass">Mot de passe</label><input class="input" type="password" id="sb-pass" autocomplete="current-password"></div>
      <button class="btn block" id="sb-login">Se connecter</button>
      <p class="muted" style="margin:12px 0 0;font-size:14px">Mot de passe oublié ? Contactez le service qualité.</p></div>`;
  const showErr=t=>{ const er=$('#sb-err'); er.innerHTML=`${ICON.warn}<span>${esc(t)}</span>`; er.style.display=''; };
  const doLogin=async()=>{ const m=$('#sb-mail').value.trim(), pw=$('#sb-pass').value, b=$('#sb-login');
    if(!m||!pw){ showErr('Saisissez votre adresse e-mail et votre mot de passe.'); return; }
    if(!SBC){ location.reload(); return; }
    b.disabled=true; b.textContent='Connexion…';
    let error=null; try{ ({error}=await SBC.auth.signInWithPassword({email:m,password:pw})); }catch(e){ error=e||{message:''}; }
    if(error){ b.disabled=false; b.textContent='Se connecter';
      showErr(/invalid/i.test(error.message||'')?'Adresse e-mail ou mot de passe incorrect.':'Connexion impossible : vérifiez la connexion internet.'); return; }
    ls.set('dp-sb-mail',m); location.reload(); };
  $('#sb-login').onclick=doLogin;
  $('#sb-pass').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
}
